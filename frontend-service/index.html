<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Booking App</title>
</head>
<body>
  <h1>Event Booking Frontend</h1>

  <section id="register">
    <h2>Register</h2>
    <input type="text" id="reg-username" placeholder="Username" />
    <input type="email" id="reg-email" placeholder="Email" />
    <input type="password" id="reg-password" placeholder="Password" />
    <button onclick="register()">Register</button>
  </section>

  <section id="login">
    <h2>Login</h2>
    <input type="email" id="login-email" placeholder="Email" />
    <input type="password" id="login-password" placeholder="Password" />
    <button onclick="login()">Login</button>
  </section>

  <section id="user-actions" style="display:none">
    <h2>Welcome, <span id="user-name"></span></h2>
    <button onclick="fetchEvents()">Fetch Events</button>
    <div id="events"></div>

    <h3>Book Tickets</h3>
    <input type="text" id="book-event-id" placeholder="Event ID" />
    <input type="number" id="book-tickets" placeholder="Tickets" />
    <button onclick="bookTickets()">Book</button>
    <div id="booking-response"></div>

    <h3>Your Notifications</h3>
    <button onclick="getNotifications()">Get Notifications</button>
    <ul id="notifications"></ul>
  </section>

  <section id="admin-actions" style="display:none">
    <h2>Create Event (Admin)</h2>
    <input type="text" id="event-title" placeholder="Title" />
    <input type="text" id="event-description" placeholder="Description" />
    <input type="datetime-local" id="event-date" />
    <input type="text" id="event-location" placeholder="Location" />
    <input type="number" id="event-tickets" placeholder="Available Tickets" />
    <button onclick="createEvent()">Create</button>
  </section>

  <script>
    const BASE_URL = 'http://localhost:8000';
    let token = '';
    let userEmail = '';

    async function register() {
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      await fetch(`${BASE_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
    }

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const res = await fetch(`${BASE_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      token = data.access_token;
      userEmail = email;

      document.getElementById('user-name').textContent = email;
      document.getElementById('user-actions').style.display = 'block';
      if (email === 'hamza.omer.zaki@gmail.com') {
        document.getElementById('admin-actions').style.display = 'block';
      }
    }

    async function fetchEvents() {
      const res = await fetch(`${BASE_URL}/events`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const events = await res.json();
      document.getElementById('events').innerText = JSON.stringify(events, null, 2);
    }

    async function bookTickets() {
      const event_id = document.getElementById('book-event-id').value;
      const num_tickets = parseInt(document.getElementById('book-tickets').value);

      const res = await fetch(`${BASE_URL}/bookings`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ event_id, num_tickets })
      });

      const data = await res.json();
      document.getElementById('booking-response').innerText = JSON.stringify(data, null, 2);
    }

    async function getNotifications() {
      const res = await fetch(`${BASE_URL}/notifications/${userEmail}`);
      const notes = await res.json();
      const list = document.getElementById('notifications');
      list.innerHTML = '';
      notes.forEach(note => {
        const li = document.createElement('li');
        li.textContent = note.message;
        list.appendChild(li);
      });
    }

    async function createEvent() {
      const title = document.getElementById('event-title').value;
      const description = document.getElementById('event-description').value;
      const date = document.getElementById('event-date').value;
      const location = document.getElementById('event-location').value;
      const available_tickets = parseInt(document.getElementById('event-tickets').value);

      const res = await fetch(`${BASE_URL}/events`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, date, location, available_tickets })
      });
      alert('Event created!');
    }
  </script>
</body>
</html>
